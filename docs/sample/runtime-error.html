<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML Preview Runtime Error Fixture</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 48px, 720px);
      margin: 0 auto;
      padding: 64px 0;
    }

    article {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }

    h1 { margin-top: 0; color: var(--accent); }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <article>
      <h1>Runtime error fixture</h1>
      <p>This document renders first and then reports a deterministic runtime error.</p>
    </article>
  </main>

  <script>
    setTimeout(function () {
      throw new Error('Deterministic runtime error fixture');
    }, 50);
  </script>
</body>
</html>
